services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - ./app:/app/app
      - ./alembic:/app/alembic
    env_file: .env
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  db-data:
